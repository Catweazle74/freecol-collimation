    <circle cx="204" cy="24" r="7" fill="none" stroke="#D9534F" stroke-width="3"/>
    <text x="220" y="29" fill="#dddddd">Obstruktion (IST)</text>
    <line x1="370" y1="24" x2="392" y2="24" stroke="#E8C547" stroke-width="3"/>
    <text x="400" y="29" fill="#dddddd">Versatz</text>
  </g>
